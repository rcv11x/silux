[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "silux-bench"
version = "0.1.0"
description = "Silux's native memory benchmark: latency by block size"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Rust",
]

[tool.maturin]
features = ["python"]
module-name = "silux_bench"
