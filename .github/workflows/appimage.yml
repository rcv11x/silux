# Construye los dos AppImages en una distribución antigua, que es lo que los
# hace funcionar en máquinas que no son la del que compila.
#
# Un AppImage se lleva dentro los binarios del sistema donde se construyó, con
# sus exigencias: la versión de glibc y el nivel de instrucciones del
# procesador. Construido en una distribución moderna deja fuera a quien tenga
# un sistema o un procesador más viejos, y el error que ven no dice de qué se
# trata. Construido en Ubuntu 22.04 funciona en las dos.
#
# Son dos paquetes y no uno porque Qt 6.10 pasó a compilarse con
# `-march=x86-64-v2`, y no en rutas que se eligen mirando la CPU sino dentro de
# funciones normales. En un procesador sin SSE4.1 eso es «Instrucción ilegal»
# antes de pintar nada. El `-compat` lleva la última serie de Qt que se compila
# para x86-64 a secas.

name: AppImage

# Corre en cada empujón a master y no solo al publicar. Estaba atado a los
# tags, y como no hubo ninguno hasta la 0.2.0, la primera vez que se ejecutó
# llevaba meses sin probarse y falló: los tests que aquí pasan se hacen en el
# Python de quien desarrolla, no en el 3.10 que declara el README y que lleva
# dentro el paquete. Enterarse el día que se publica es enterarse tarde.
#
# Se construye siempre, porque empaquetar es justo lo que se rompe solo; lo que
# depende del tag es publicar.
on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Para adjuntar los paquetes a la release. El token de las acciones es de solo
# lectura por omisión desde que GitHub cambió ese valor, así que sin esto el
# último paso muere con «Resource not accessible by integration» después de
# haber construido los dos AppImages, que es el sitio más caro para fallar.
permissions:
  contents: write

jobs:
  # Los dos extremos del rango declarado, y los dos hacen falta.
  #
  # Con solo el de abajo se escapa lo que se rompe en el nuevo; con solo el de
  # arriba —que es lo que pasaba, porque aquí no había matriz y en la máquina
  # del autor corre 3.14— se escapa lo que se rompe en el mínimo. Costó las dos
  # cosas a la vez: `self.enterContext` es de 3.11 y se llevó once tests por
  # delante, y un traceback perdía el texto de la línea porque hasta 3.12 quien
  # pinta las excepciones no atrapadas es el escritor en C, que busca el código
  # abriendo el archivo. Ninguna de las dos se ve leyendo el código.
  #
  # 22.04 en los dos porque es donde se construye el AppImage; el intérprete lo
  # pone `setup-python` para que quede escrito cuál se prueba y no dependa de
  # cuál traiga el runner ese mes.
  tests:
    runs-on: ubuntu-22.04

    strategy:
      # Que una versión falle no cancela la otra: saber si falla en las dos o
      # en una es la mitad del diagnóstico.
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Instalar lo que Qt necesita para arrancar
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3 \
            libfontconfig1 libfreetype6 libglib2.0-0 hwdata

      - name: Instalar PySide6
        run: pip install "$(python tools/build_appimage.py --pyside-range)"

      # Si fallan, cada fallo sale como anotación además de en el registro. El
      # registro pide autenticación para leerse y las anotaciones no, así que
      # esto es lo que permite saber qué se rompió sin abrir la web: el primer
      # fallo de esta acción se persiguió a ciegas, reproduciendo el entorno
      # cuatro veces, porque lo único que se podía leer desde fuera era
      # «Process completed with exit code 1».
      - name: Pasar los tests
        run: |
          set -o pipefail
          QT_QPA_PLATFORM=offscreen python -m unittest discover -s tests -t . \
            2>&1 | tee /tmp/tests.log && exit 0
          echo "::error::Los tests no pasan en $(python -V)"
          grep -E '^(FAIL|ERROR):' /tmp/tests.log | while read -r linea; do
            echo "::error::$linea"
          done
          grep -E '^(Ran |FAILED)' /tmp/tests.log | while read -r linea; do
            echo "::error::$linea"
          done
          exit 1

  build:
    # A propósito la más antigua con soporte: lo compilado contra una glibc
    # vieja funciona en las nuevas, pero no al revés.
    runs-on: ubuntu-22.04
    # Empaquetar tarda y sube artefactos; si los tests no pasan, no hay nada
    # que empaquetar.
    needs: tests

    steps:
      - uses: actions/checkout@v4

      # `hwdata` trae `pci.ids`, que es de donde salen los nombres de los
      # dispositivos: sin él, un test que busca una tarjeta por su
      # identificador no la encuentra. Estaba saliendo bien porque el runner
      # la trae de serie, que es una forma de decir que no se estaba pidiendo.
      - name: Instalar lo que Qt necesita para arrancar
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3 \
            libfontconfig1 libfreetype6 libglib2.0-0 \
            hwdata file desktop-file-utils fuse

      # El rango se le pregunta al empaquetador en vez de repetirlo aquí. Lo
      # que no se fija cambia solo, y lo hace en la máquina de otro: este paso
      # decía «PySide6>=6.6» a secas y con eso el paquete compat habría salido
      # con un Qt que no arranca en los procesadores para los que existe.
      - name: Instalar PySide6
        run: pip install "$(python tools/build_appimage.py --pyside-range)"

      - name: Construir el AppImage
        run: python tools/build_appimage.py

      - name: Comprobar que arranca
        run: |
          chmod +x dist/silux-x86_64.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 QT_QPA_PLATFORM=offscreen \
            ./dist/silux-x86_64.AppImage --help

      # El compat va después y con su propio Qt: `copiar_pyside` se lleva el
      # que esté instalado, así que el techo hay que ponerlo antes de
      # construir, no al construir.
      - name: Instalar el PySide6 del paquete compatible
        run: pip install "$(python tools/build_appimage.py --pyside-range --compat)"

      - name: Construir el AppImage compatible
        run: python tools/build_appimage.py --compat

      - name: Comprobar que el compatible arranca
        run: |
          chmod +x dist/silux-x86_64-compat.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 QT_QPA_PLATFORM=offscreen \
            ./dist/silux-x86_64-compat.AppImage --help

      - uses: actions/upload-artifact@v4
        with:
          name: appimages
          path: |
            dist/silux-x86_64.AppImage
            dist/silux-x86_64-compat.AppImage

      - name: Publicarlos en la release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG.md
          files: |
            dist/silux-x86_64.AppImage
            dist/silux-x86_64-compat.AppImage
