# Construye los dos AppImages en una distribución antigua, que es lo que los
# hace funcionar en máquinas que no son la del que compila.
#
# Un AppImage se lleva dentro los binarios del sistema donde se construyó, con
# sus exigencias: la versión de glibc y el nivel de instrucciones del
# procesador. Construido en una distribución moderna deja fuera a quien tenga
# un sistema o un procesador más viejos, y el error que ven no dice de qué se
# trata. Construido en Ubuntu 22.04 funciona en las dos.
#
# Son dos paquetes y no uno porque Qt 6.10 pasó a compilarse con
# `-march=x86-64-v2`, y no en rutas que se eligen mirando la CPU sino dentro de
# funciones normales. En un procesador sin SSE4.1 eso es «Instrucción ilegal»
# antes de pintar nada. El `-compat` lleva la última serie de Qt que se compila
# para x86-64 a secas.

# Se llama CI y no AppImage porque hace más que empaquetar: primero pasa la
# suite en las dos puntas del rango declarado y solo después construye. Ese
# nombre es el que sale en el badge del README.
#
# El archivo, en cambio, sigue siendo `appimage.yml` a propósito. La URL del
# badge y el historial de ejecuciones van por el nombre del archivo, no por el
# del workflow: renombrarlo dejaría el badge con un aspa permanente y las
# ejecuciones anteriores colgando de un workflow que ya no existe.
name: CI

# Corre en cada empujón a master y no solo al publicar. Estaba atado a los
# tags, y como no hubo ninguno hasta la 0.2.0, la primera vez que se ejecutó
# llevaba meses sin probarse y falló: los tests que aquí pasan se hacen en el
# Python de quien desarrolla, no en el 3.10 que declara el README y que lleva
# dentro el paquete. Enterarse el día que se publica es enterarse tarde.
#
# Se construye siempre, porque empaquetar es justo lo que se rompe solo; lo que
# depende del tag es publicar.
on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Para adjuntar los paquetes a la release. El token de las acciones es de solo
# lectura por omisión desde que GitHub cambió ese valor, así que sin esto el
# último paso muere con «Resource not accessible by integration» después de
# haber construido los dos AppImages, que es el sitio más caro para fallar.
permissions:
  contents: write

jobs:
  # Cada paquete con el Python y el PySide6 que lleva dentro: el normal, 3.14
  # y la última PySide6; el compat, el 3.10 de Ubuntu 22.04 y la 6.9. El 3.10
  # es además el suelo del código, porque es lo que lleva el compat.
  #
  # Las dos parejas hacen falta. Con solo la de arriba se escapa lo que se
  # rompe en el mínimo: `self.enterContext` es de 3.11 y se llevó once tests
  # por delante, y un traceback perdía el texto de la línea porque hasta 3.12
  # quien pinta las excepciones no atrapadas es el escritor en C. Ninguna de
  # las dos se ve leyendo el código. `tests/test_empaquetado.py` compara esta
  # matriz con la tabla `PYTHON` del empaquetador.
  #
  # 22.04 en las dos porque es donde se construye el AppImage; el intérprete lo
  # pone `setup-python` para que quede escrito cuál se prueba y no dependa de
  # cuál traiga el runner ese mes.
  tests:
    name: tests (${{ matrix.paquete }}, Python ${{ matrix.python }})
    runs-on: ubuntu-22.04

    strategy:
      # Que una versión falle no cancela la otra: saber si falla en las dos o
      # en una es la mitad del diagnóstico.
      fail-fast: false
      matrix:
        include:
          - paquete: normal
            python: "3.14"
          - paquete: compat
            python: "3.10"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      # Lo que no es de documentación (IP, MAC, IPv6 con identificador,
      # claves, correos, series de los volcados) en cualquier archivo
      # versionado. Dice archivo, línea y qué es, nunca el dato: este registro
      # es público. Lo de la máquina que ejecuta aquí es el runner y no cuenta.
      - name: Comprobar la privacidad
        run: python tools/comprobar_privacidad.py

      # Pyflakes and the import order, as pyproject.toml sets them; the same
      # version as .pre-commit-config.yaml.
      - name: Comprobar el código con ruff
        if: matrix.paquete == 'normal'
        run: |
          python -m pip install ruff==0.17.6
          ruff check silux tools tests

      - name: Instalar lo que Qt necesita para arrancar
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3 \
            libfontconfig1 libfreetype6 libglib2.0-0 hwdata

      # PySide6 con el rango del paquete de esa pareja, que es el que se
      # reparte; pytest y xdist, del grupo `dev` de `pyproject.toml`, para que
      # la versión esté escrita en un solo sitio. `--group` es de pip 25.1.
      - name: Instalar PySide6 y lo de desarrollo
        run: |
          python -m pip install --upgrade pip
          pip install --group dev "$(python tools/build_appimage.py --pyside-range ${{ matrix.paquete == 'compat' && '--compat' || '' }})"
          python -c 'import PySide6, sys; print("Python", sys.version.split()[0], "· PySide6", PySide6.__version__)'

      # Informative only: the code is not typed through yet. Its count says
      # whether a change made it better or worse.
      - name: mypy (informativo)
        if: matrix.paquete == 'normal'
        continue-on-error: true
        run: |
          python -m pip install mypy==2.4.1
          mypy silux --ignore-missing-imports

      # Si fallan, cada fallo sale como anotación además de en el registro. El
      # registro pide autenticación para leerse y las anotaciones no, así que
      # esto es lo que permite saber qué se rompió sin abrir la web: el primer
      # fallo de esta acción se persiguió a ciegas, reproduciendo el entorno
      # cuatro veces, porque lo único que se podía leer desde fuera era
      # «Process completed with exit code 1».
      #
      # En dos pasadas: todo repartido entre los procesadores del runner, y
      # después, solos, los tres tests que comparan dos medidas de rendimiento
      # (`tests/conftest.py`). Repartidos con los demás miden cuánto les dejan
      # los otros procesos, no el equipo.
      - name: Pasar los tests
        run: |
          set -o pipefail
          export QT_QPA_PLATFORM=offscreen
          { python -m pytest -n auto -q -m "not a_solas" \
              && python -m pytest -q -m a_solas; } 2>&1 | tee /tmp/tests.log && exit 0
          echo "::error::Los tests no pasan en $(python -V)"
          grep -E "^(FAILED|ERROR) |crashed while running" /tmp/tests.log | while read -r linea; do
            echo "::error::$linea"
          done
          grep -E '^[0-9]+ (failed|passed|errors?|deselected)' /tmp/tests.log | while read -r linea; do
            echo "::error::$linea"
          done
          exit 1

  build:
    # A propósito la más antigua con soporte: lo compilado contra una glibc
    # vieja funciona en las nuevas, pero no al revés.
    runs-on: ubuntu-22.04
    # Empaquetar tarda y sube artefactos; si los tests no pasan, no hay nada
    # que empaquetar.
    needs: tests

    steps:
      - uses: actions/checkout@v5

      # Lo que hace falta en el runner es solo lo que pide arrancar el
      # resultado para comprobarlo; lo que pide construirlo va dentro del
      # contenedor.
      - name: Instalar lo que Qt necesita para arrancar
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3 \
            libfontconfig1 libfreetype6 libglib2.0-0

      # Dentro del contenedor y no en el runner. Construido aquí, el paquete
      # se llevaba lo que trajera el runner ese día y no la receta: el de la
      # v0.2.0 salió sin siete `libxcb-*` que `libqxcb.so` necesita y que la
      # receta instala antes de empaquetar, porque `ldd` solo informa de lo
      # que puede resolver. El PySide6 lo pone el propio contenedor con el
      # rango de `RANGO_PYSIDE`, así que aquí no se instala ninguno.
      - name: Construir el AppImage
        run: python3 tools/build_appimage.py --container

      - name: Construir el AppImage compatible
        run: python3 tools/build_appimage.py --container --compat

      # Con docker los archivos salen de root; con podman sin privilegios, del
      # usuario. Así da igual cuál de los dos haya encontrado el empaquetador.
      - name: Recuperar la propiedad de lo construido
        run: sudo chown -R "$(id -u):$(id -g)" dist

      - name: Comprobar que arranca
        run: |
          chmod +x dist/silux-x86_64.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 QT_QPA_PLATFORM=offscreen \
            ./dist/silux-x86_64.AppImage --help

      - name: Comprobar que el compatible arranca
        run: |
          chmod +x dist/silux-x86_64-compat.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 QT_QPA_PLATFORM=offscreen \
            ./dist/silux-x86_64-compat.AppImage --help

      # La ventana en una distribución al día, sin un solo aviso: un
      # fontconfig empaquetado de Ubuntu 22.04 sacaba decenas al leer la
      # configuración de uno nuevo. `--help` no carga la parte gráfica de Qt,
      # así que se hace una captura sin pantalla.
      - name: Arrancar la ventana en una distribución al día
        run: |
          for ai in silux-x86_64.AppImage silux-x86_64-compat.AppImage; do
            docker run --rm -v "$PWD/dist":/ai:ro -e APPIMAGE_EXTRACT_AND_RUN=1 \
              -e QT_QPA_PLATFORM=offscreen docker.io/library/archlinux:latest sh -c "
                pacman -Sy --noconfirm --needed fontconfig freetype2 libglvnd libxkbcommon \
                  libxkbcommon-x11 dbus glib2 ttf-dejavu libx11 libxcb > /dev/null
                cp /ai/$ai /tmp/ && cd /tmp
                ./$ai --screenshot /tmp/s.png --page Inicio > salida.txt 2>&1 || { cat salida.txt; exit 1; }
                test -s /tmp/s.png || { echo '::error::$ai no hizo la captura'; exit 1; }
                if grep -i fontconfig salida.txt; then echo '::error::$ai: avisos de fontconfig'; exit 1; fi"
          done

      # Lo que compara el programa antes de sustituirse al actualizar
      # (`silux/updates.py`): sin esta lista no se baja nada. Va siempre, no
      # solo al etiquetar, porque los borradores se montan con el artefacto.
      - name: Calcular las sumas
        run: |
          cd dist
          sha256sum silux-x86_64.AppImage silux-x86_64-compat.AppImage > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@v6
        with:
          name: appimages
          path: |
            dist/silux-x86_64.AppImage
            dist/silux-x86_64-compat.AppImage
            dist/SHA256SUMS

      - name: Publicarlos en la release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        # Sin body ni body_path: las notas las pone el autor en el borrador,
        # solo con la entrada de esa versión. Con `body_path: CHANGELOG.md`
        # la etiqueta las pisaba con el CHANGELOG entero, todas las versiones.
        with:
          files: |
            dist/silux-x86_64.AppImage
            dist/silux-x86_64-compat.AppImage
            dist/SHA256SUMS
