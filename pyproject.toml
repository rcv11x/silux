[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cpuz"
version = "0.1.0"
description = "Perfilador de hardware para Linux con interfaz Qt"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
gui = ["PySide6>=6.6"]

[project.scripts]
cpuz = "cpuz.cli:main"

[project.gui-scripts]
cpuz-gui = "cpuz.ui.app:main"

[tool.setuptools.packages.find]
include = ["cpuz*"]

[tool.setuptools.package-data]
"cpuz.db" = ["*.json"]
"cpuz.ui.assets" = ["*.svg"]
