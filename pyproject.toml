[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "silux"
# La versión vive en `silux/__init__.py` y de ahí la lee setuptools. Escrita
# aquí también se desincroniza: este archivo se toca al empaquetar y aquel al
# publicar, y estuvo un tiempo diciendo 0.1.0 con el paquete ya en la 0.2.0.
dynamic = ["version"]
description = "Perfilador de hardware para Linux con interfaz Qt"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "rcv11x" }]
keywords = ["hardware", "sensores", "cpu", "gpu", "monitorización", "linux"]
classifiers = [
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware",
    "Topic :: System :: Monitoring",
]
dependencies = []

[project.optional-dependencies]
gui = ["PySide6>=6.6"]

[project.scripts]
silux = "silux.cli:main"

[project.gui-scripts]
silux-gui = "silux.ui.app:main"

[tool.setuptools.dynamic]
version = { attr = "silux.__version__" }

[tool.setuptools.packages.find]
include = ["silux*"]

[tool.setuptools.package-data]
"silux.db" = ["*.json"]
"silux.ui.assets" = ["*.svg"]
