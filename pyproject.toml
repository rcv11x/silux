[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "silux"
# La versión vive en `silux/__init__.py` y de ahí la lee setuptools. Escrita
# aquí también se desincroniza: este archivo se toca al empaquetar y aquel al
# publicar, y estuvo un tiempo diciendo 0.1.0 con el paquete ya en la 0.2.0.
dynamic = ["version"]
description = "Perfilador de hardware para Linux con interfaz Qt"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "silux/db/THIRD_PARTY_NOTICES.md"]
authors = [{ name = "rcv11x" }]
keywords = ["hardware", "sensores", "cpu", "gpu", "monitorización", "linux"]
classifiers = [
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware",
    "Topic :: System :: Monitoring",
]
dependencies = []

[project.optional-dependencies]
gui = [
    # El techo es la única excepción a no ponerle techo a PySide6 aquí, y solo
    # donde se cae. En 3.10 y 3.11, la 6.12.0 resta una referencia a `None` en
    # cada método que devuelve `void` y el proceso muere con «none_dealloc» al
    # pintar la primera gráfica; y la 6.11 libera dos veces la llamada encolada
    # de un `QScrollBar` cuando la ventana cambia de forma (al dar permisos, al
    # conectar un disco): `tools/agitar_ventana.py`, tres ventanas de seis en
    # diez minutos. Desde 3.12 las dos funcionan.
    "PySide6>=6.6,<6.11; python_version < '3.12'",
    "PySide6>=6.6; python_version >= '3.12'",
]

# Lo que hace falta para desarrollar y no para usar el programa. Es un grupo
# y no un extra: un extra se publica con el paquete, y nadie que instale silux
# necesita pytest. `uv sync --extra gui` lo instala junto a lo demás.
[dependency-groups]
dev = [
    "pytest>=9.2,<10",
    # Los tests en paralelo: la suite baja de dos minutos a medio.
    "pytest-xdist>=3.8,<4",
]

[project.scripts]
silux = "silux.cli:main"

[project.gui-scripts]
silux-gui = "silux.ui.app:main"

[tool.setuptools.dynamic]
version = { attr = "silux.__version__" }

[tool.setuptools.packages.find]
include = ["silux*"]
# `include` decide qué se empaqueta, pero no dónde se busca: setuptools recorre
# todo el árbol siguiendo enlaces, y los volcados de `tests/fixtures/equipos`
# son /sys enteros con enlaces que dan la vuelta. Sin esto, construir el
# paquete no termina nunca.
exclude = ["tests*", "tools*", "docs*", "dist*", "build*"]

[tool.setuptools.package-data]
"silux.db" = ["*.json", "*.md"]
# Carpeta a carpeta: la regla de `silux.db` no alcanza a la de dentro.
"silux.db.lang" = ["*.json"]
"silux.ui.assets" = ["*.svg"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Pyflakes and the import order. Formatting is not enforced yet: a single
# `ruff format` pass goes with .git-blame-ignore-revs.
select = ["F", "I"]

[tool.ruff.lint.per-file-ignores]
# The tests are checked when they pass to English, zone by zone.
"tests/**" = ["F401", "F811", "F841", "F402", "I001"]

[tool.ruff.lint.isort]
known-first-party = ["silux", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Los volcados de equipo son árboles de /sys con enlaces que dan la vuelta:
# si pytest entra a buscar tests ahí, no termina de recogerlos. Dieciséis
# procesos estuvieron diez minutos al 100 % sin ejecutar ninguno.
norecursedirs = ["fixtures"]
markers = [
    "a_solas: compara dos medidas de rendimiento y necesita el equipo para él (tests/conftest.py)",
    "anchura: cada página de cada volcado con cada letra; el CI los pasa solo con el paquete normal (tests/reparto.py)",
]
